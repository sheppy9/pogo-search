<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POGO Typing Search</title>
    <meta name="description" content="Generate Pokemon GO search strings for raids based on selected types.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>POGO Typing Search</h1>
            <p>Find the best attackers for your raids</p>
            <p class="subtitle">Select types to copy the search string automatically.</p>
        </header>

        <main>
            <div class="controls-header">
                <h2>Types</h2>
                <button id="clear-btn" class="clear-btn">Clear All</button>
            </div>

            <div class="type-grid" id="type-grid">
                <!-- Type buttons will be generated by JavaScript -->
            </div>
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Copied to clipboard!</div>

    <!-- Script -->
    <script src="index.js"></script>
</body>

</html>
