<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POGO Raid Search Generator</title>
    <meta name="description" content="Generate Pokemon GO search strings for raids based on selected types.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>POGO Raid</h1>
            <p>Find the best attackers for your raids</p>
            <p class="subtitle">Select types to copy the search string automatically.</p>
        </header>

        <main>
            <div class="controls-header">
                <h2>Types</h2>
                <button id="clear-btn" class="clear-btn">Clear All</button>
            </div>

            <div class="type-grid" id="type-grid">
                <!-- Type buttons will be generated by JavaScript -->
            </div>

            <div class="output-container">
                <h3>Generated String</h3>
                <div class="output-box" id="output-box">
                    <span class="placeholder">Select types to generate string</span>
                </div>
            </div>
        </main>
        
        <footer>
            <p>1. Search boss &bull; 2. Copy &bull; 3. Paste in-game</p>
        </footer>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Copied to clipboard!</div>

    <!-- Script -->
    <script src="index.js"></script>
</body>
</html>
